name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # R00 binds the dependency solver to the exact snapshot reproduced by its evidence run.
      # B01 owns reviewed dependency refreshes; CI must never float them silently.
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 resolved 2026-08-08
        with:
          # pull_request defaults to GitHub's synthetic merge ref. Milestone evidence is bound to
          # the immutable PR head instead; a SHA also works when the head branch lives in a fork.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # B00R needs the merge base to classify the PR's changed-path role; fetch full history.
          fetch-depth: 0
      - name: Bind checks to exact event head
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EVENT_HEAD_SHA"
      - name: Resolve immutable event facts
        id: event_facts
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ ! "$EVENT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             [[ "$EVENT_BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "::error::event base SHA is absent, all-zero, or non-canonical; refusing classification"
            exit 1
          fi
          if [[ ! "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             [[ "$EVENT_HEAD_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "::error::event head SHA is absent, all-zero, or non-canonical; refusing classification"
            exit 1
          fi
          printf 'base_sha=%s\nhead_sha=%s\n' \
            "$EVENT_BASE_SHA" "$EVENT_HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Classify exact event diff
        id: milestone_role
        shell: bash
        run: >-
          python tools/classify_milestone_pr.py
          --base-sha "${{ steps.event_facts.outputs.base_sha }}"
          --head-sha "${{ steps.event_facts.outputs.head_sha }}"
          --github-output "$GITHUB_OUTPUT"
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 resolved 2026-08-08
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test toolchain
        run: python -m pip install -e '.[test]'
      - name: Falsification suite
        run: python -m pytest -p no:cacheprovider
      - name: Hash-order invariance
        env:
          PYTHONHASHSEED: "1"
        run: python -m pytest -p no:cacheprovider
      - name: Exact pytest collection identity
        run: python tools/collect_test_ids.py
      - name: Source-hash inventory (B00R)
        run: python tools/verify_source_hashes.py
      - name: Historical evidence immutability
        run: python tools/verify_historical_evidence.py
      - name: Contract byte manifest
        run: python tools/verify_manifest.py
      - name: Contract manifest schema
        run: python tools/validate_contract_manifest.py
      - name: Reproducible source and wheel artifacts
        run: python tools/verify_reproducible_build.py
      - name: Installed-wheel contract smoke
        run: python tools/test_wheel_install.py
      - name: DARK capability boundary
        run: python tools/verify_no_forbidden_capabilities.py
      - name: End-to-end audit walk
        run: python tools/e2e_audit.py
      - name: Build ledger currency
        run: python tools/build_ledger.py --verify
      - name: Combined RC3+RC4 composition DAG
        run: python tools/validate_combined_dag.py
      - name: Closed B00R evidence manifest
        if: steps.milestone_role.outputs.role == 'RECEIPT'
        shell: bash
        env:
          MANIFEST_PATH: ${{ steps.milestone_role.outputs.manifest_path }}
        run: >-
          python tools/build_evidence_manifest.py
          --verify "$MANIFEST_PATH"
          --root .
          --closed-root evidence/B00R
          --require-tracked
      - name: Mark deterministic engineering complete
        id: engineering_complete
        run: echo "deterministic engineering and role-specific evidence gates completed"
      - name: Resolve trusted owner-validation time
        id: owner_time
        shell: bash
        run: printf 'now_us=%s000000\n' "$(date -u +%s)" >> "$GITHUB_OUTPUT"
      # Owner checks come last so an expected ceremony block cannot hide deterministic evidence.
      - name: Concrete critical-path CODEOWNERS identity
        run: python tools/verify_codeowners.py
      # SOURCE cannot merge green until owner authority and the provider-enforced main ruleset are
      # both present, externally pinned, current, and strict.  UNAVAILABLE is a non-zero block.
      - name: Strict source authority control
        if: >-
          always() && steps.engineering_complete.outcome == 'success' &&
          steps.milestone_role.outputs.role == 'SOURCE'
        shell: bash
        env:
          NOW_US: ${{ steps.owner_time.outputs.now_us }}
          EXPECTED_HEAD: ${{ steps.event_facts.outputs.head_sha }}
          AUTHORITY_BUNDLE_DECISION_SHA256: ${{ vars.AUTHORITY_BUNDLE_DECISION_SHA256 }}
          RECEIPT_PROFILE_DECISION_SHA256: ${{ vars.RECEIPT_PROFILE_DECISION_SHA256 }}
          B00_REPAIR_DECISION_SHA256: ${{ vars.B00_REPAIR_DECISION_SHA256 }}
          RECEIPT_TRUST_REGISTRY_SHA256: ${{ vars.RECEIPT_TRUST_REGISTRY_SHA256 }}
        run: >-
          python tools/validate_authority_root.py --strict --now-us "$NOW_US"
          --expected-head "$EXPECTED_HEAD" --git-root .
      - name: Strict source provider control
        if: >-
          always() && steps.engineering_complete.outcome == 'success' &&
          steps.milestone_role.outputs.role == 'SOURCE'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOW_US: ${{ steps.owner_time.outputs.now_us }}
          EXPECTED_HEAD: ${{ steps.event_facts.outputs.head_sha }}
          MAIN_RULESET_EVIDENCE_SHA256: ${{ vars.MAIN_RULESET_EVIDENCE_SHA256 }}
        run: >-
          python tools/validate_governance_snapshot.py --strict
          --snapshot docs/governance/rulesets/main.ruleset.provider.json
          --provider-raw docs/governance/rulesets/main.ruleset.provider.raw.json
          --provider-pin "$MAIN_RULESET_EVIDENCE_SHA256"
          --expected-head "$EXPECTED_HEAD" --git-root .
          --now-us "$NOW_US"
      - name: Strict B00R authority control
        if: >-
          always() && steps.engineering_complete.outcome == 'success' &&
          steps.milestone_role.outputs.role == 'RECEIPT'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOW_US: ${{ steps.owner_time.outputs.now_us }}
          EXPECTED_HEAD: ${{ steps.event_facts.outputs.head_sha }}
          AUTHORITY_BUNDLE_DECISION_SHA256: ${{ vars.AUTHORITY_BUNDLE_DECISION_SHA256 }}
          RECEIPT_PROFILE_DECISION_SHA256: ${{ vars.RECEIPT_PROFILE_DECISION_SHA256 }}
          B00_REPAIR_DECISION_SHA256: ${{ vars.B00_REPAIR_DECISION_SHA256 }}
          RECEIPT_TRUST_REGISTRY_SHA256: ${{ vars.RECEIPT_TRUST_REGISTRY_SHA256 }}
        run: >-
          python tools/validate_authority_root.py --strict --now-us "$NOW_US"
          --expected-head "$EXPECTED_HEAD" --git-root .
      - name: Strict B00R provider control
        if: >-
          always() && steps.engineering_complete.outcome == 'success' &&
          steps.milestone_role.outputs.role == 'RECEIPT'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOW_US: ${{ steps.owner_time.outputs.now_us }}
          EXPECTED_HEAD: ${{ steps.event_facts.outputs.head_sha }}
          MAIN_RULESET_EVIDENCE_SHA256: ${{ vars.MAIN_RULESET_EVIDENCE_SHA256 }}
        run: >-
          python tools/validate_governance_snapshot.py --strict
          --snapshot docs/governance/rulesets/main.ruleset.provider.json
          --provider-raw docs/governance/rulesets/main.ruleset.provider.raw.json
          --provider-pin "$MAIN_RULESET_EVIDENCE_SHA256"
          --expected-head "$EXPECTED_HEAD" --git-root .
          --now-us "$NOW_US"
      - name: Authenticate exactly one B00R receipt
        if: >-
          always() && steps.engineering_complete.outcome == 'success' &&
          steps.milestone_role.outputs.role == 'RECEIPT'
        shell: bash
        env:
          NOW_US: ${{ steps.owner_time.outputs.now_us }}
          EXPECTED_HEAD: ${{ steps.event_facts.outputs.head_sha }}
          RECEIPT_PATH: ${{ steps.milestone_role.outputs.receipt_path }}
          MANIFEST_PATH: ${{ steps.milestone_role.outputs.manifest_path }}
          AUTHORITY_BUNDLE_DECISION_SHA256: ${{ vars.AUTHORITY_BUNDLE_DECISION_SHA256 }}
          RECEIPT_PROFILE_DECISION_SHA256: ${{ vars.RECEIPT_PROFILE_DECISION_SHA256 }}
          B00_REPAIR_DECISION_SHA256: ${{ vars.B00_REPAIR_DECISION_SHA256 }}
          RECEIPT_TRUST_REGISTRY_SHA256: ${{ vars.RECEIPT_TRUST_REGISTRY_SHA256 }}
          MAIN_RULESET_EVIDENCE_SHA256: ${{ vars.MAIN_RULESET_EVIDENCE_SHA256 }}
        run: >-
          python tools/validate_b_receipt.py
          --strict
          --milestone B00R
          --now-us "$NOW_US"
          --manifest "$MANIFEST_PATH"
          --git-root .
          --expected-head "$EXPECTED_HEAD"
          --governance-snapshot docs/governance/rulesets/main.ruleset.provider.json
          --provider-raw docs/governance/rulesets/main.ruleset.provider.raw.json
          --provider-pin "$MAIN_RULESET_EVIDENCE_SHA256"
          "$RECEIPT_PATH"
      # This job authenticates the exact receipt PR/main-push head. It does not claim terminal
      # closure: after the receipt merge, `b00r_gate --mode receipt --expected-head <merge>
      # --base-sha <source-merge> --now-us <trusted-us>` additionally requires the protected,
      # annotated (not signature-verified) B00R_RECEIPT_ANCHOR.
