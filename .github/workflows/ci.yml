name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # R00 binds the dependency solver to the exact snapshot reproduced by its evidence run.
      # B01 owns reviewed dependency refreshes; CI must never float them silently.
      PIP_CONSTRAINT: constraints/ci.txt
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 resolved 2026-08-08
        with:
          # pull_request defaults to GitHub's synthetic merge ref. Milestone evidence is bound to
          # the immutable PR head instead; mergeability is checked separately before merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind checks to exact event head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 resolved 2026-08-08
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test toolchain
        run: python -m pip install -e '.[test]'
      - name: Falsification suite
        run: python -m pytest
      - name: Contract byte manifest
        run: python tools/verify_manifest.py
      - name: Contract manifest schema
        run: python tools/validate_contract_manifest.py
      - name: Installed-wheel contract smoke
        run: python tools/test_wheel_install.py
      - name: DARK capability boundary
        run: python tools/verify_no_forbidden_capabilities.py
