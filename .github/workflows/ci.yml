name: CI

# ONE workflow serves both PR classes. The frozen audit runner requires, on the exact PR head
# and with a run conclusion of "success":
#   * SOURCE PR  -> the 18 REQUIRED_CI_STEPS below, each present and concluding "success";
#   * RECEIPT PR -> "Checkout exact head", "Bind checks to exact event head", "Receipt
#                   authentication", each present and concluding "success".
# A "skipped" conclusion on a required step FAILS, so every required-named step runs
# UNCONDITIONALLY (no `if:`); the whole run must be green for either class to pass. The runner
# additionally byte-pins these workflow bytes (operator-supplied --workflow-sha256), so this file
# is byte-stable across a source PR and its receipt PR.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # R00 binds the dependency solver to the exact snapshot reproduced by its evidence run.
      # B01 owns reviewed dependency refreshes; CI must never float them silently.
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 resolved 2026-08-08
        with:
          # pull_request defaults to GitHub's synthetic merge ref. Milestone evidence is bound to
          # the immutable PR head instead; a SHA also works when the head branch lives in a fork.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The receipt branch is exactly one commit atop the corrective merge; the sealer reads
          # both raw commit objects and therefore must not use checkout's depth-1 default.
          fetch-depth: 2
      - name: Bind checks to exact event head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 resolved 2026-08-08
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test toolchain
        run: python -m pip install -e '.[test]'
      - name: Falsification suite
        run: python -m pytest
      - name: Hash-order invariance
        env:
          PYTHONHASHSEED: "1"
        run: python -m pytest
      - name: Exact pytest collection identity
        run: python tools/collect_test_ids.py
      - name: Contract byte manifest
        run: python tools/verify_manifest.py
      - name: Contract manifest schema
        run: python tools/validate_contract_manifest.py
      - name: Reproducible source and wheel artifacts
        run: python tools/verify_reproducible_build.py
      - name: Installed-wheel contract smoke
        run: python tools/test_wheel_install.py
      - name: OFF capability boundary
        run: python tools/verify_no_forbidden_capabilities.py
      - name: End-to-end audit walk
        run: python tools/e2e_audit.py
      - name: Build ledger currency
        run: python tools/build_ledger.py --verify
      - name: Combined RC3+RC4 composition DAG
        run: python tools/validate_combined_dag.py
      - name: Strict B-series receipt chain
        run: python tools/validate_b_receipt.py --all --strict
      - name: Spec/control count reconciliation
        run: python tools/verify_spec_control_counts.py --strict
      - name: Tracked secret scan
        run: python tools/scan_secrets.py --tracked --fail-on-hit
      - name: Receipt authentication
        # Runs on every PR class: on a source PR it re-authenticates the existing sealed receipt
        # chain (a clean no-op success); on a receipt PR the newly-added milestone receipt is
        # present and is authenticated here. Read-only; leaves the tree clean.
        run: python tools/validate_b_receipt.py --all --strict
